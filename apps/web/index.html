    <script>
      /* A theme chosen with the in-app toggle (themePreference.ts, key "one.theme") applies before
         the first paint, so the boot screen matches the app that follows it. */
      try { var t = localStorage.getItem('one.theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}

        --b-text-2: #434D69; --b-text-3: #5F6987; --b-brand: #1E6BFF; --b-lines: rgba(10,16,48,.035); --b-halo: rgba(30,107,255,.20); --b-glow: .5;

        font-family: 'DM Sans Variable', 'DM Sans', ui-sans-serif, sans-serif; transition: opacity 450ms cubic-bezier(.2,.8,.2,1); }

          background: radial-gradient(64% 70% at 50% 46%, rgba(43,27,184,.42) 0%, rgba(30,107,255,.12) 50%, transparent 74%), radial-gradient(50% 45% at 8% 100%, rgba(24,200,232,.12), transparent 70%), linear-gradient(160deg, #0B1236 0%, #070A18 58%, #050816 100%); }
        :root:not([data-theme="light"]) #one-boot .b-light { display: none; }
        :root:not([data-theme="light"]) #one-boot .b-dark { display: block; }
      }
      :root[data-theme="dark"] #one-boot { color-scheme: dark; --b-text-2: #B3BBD6; --b-text-3: #8F99BA; --b-brand: #4F8DFF; --b-lines: rgba(255,255,255,.03); --b-halo: rgba(63,160,255,.42); --b-glow: 1;
        background: radial-gradient(64% 70% at 50% 46%, rgba(43,27,184,.42) 0%, rgba(30,107,255,.12) 50%, transparent 74%), radial-gradient(50% 45% at 8% 100%, rgba(24,200,232,.12), transparent 70%), linear-gradient(160deg, #0B1236 0%, #070A18 58%, #050816 100%); }
      :root[data-theme="dark"] #one-boot .b-light { display: none; }
      :root[data-theme="dark"] #one-boot .b-dark { display: block; }
      #one-boot::before { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(102deg, transparent 0 118px, var(--b-lines) 118px 119px); -webkit-mask-image: linear-gradient(180deg, transparent, #000 30%, #000 70%, transparent); mask-image: linear-gradient(180deg, transparent, #000 30%, #000 70%, transparent); }
      #one-boot .b-stage { position: absolute; left: 50%; top: 44%; --u: min(1px, calc(100vw / 980)); width: calc(900 * var(--u)); height: calc(560 * var(--u)); translate: -50% -50%; }
      #one-boot .b-ribbons { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
      #one-boot .b-rb { transform-box: view-box; transform-origin: 450px 280px; }
      #one-boot .b-glowl { opacity: calc(var(--o) * var(--b-glow)); }
      #one-boot .b-lens { position: absolute; left: 50%; top: 50%; width: calc(132 * var(--u)); height: calc(132 * var(--u)); translate: -50% -50%; }
      #one-boot .b-halo { position: absolute; inset: -45%; border-radius: 50%; background: radial-gradient(circle, var(--b-halo) 0, transparent 66%); }
      #one-boot .b-lens img { position: absolute; inset: 0; width: 100%; height: 100%; }
      #one-boot .b-foot { position: absolute; left: 0; right: 0; top: calc(44% + 215px); display: flex; flex-direction: column; align-items: center; gap: 22px; }
      #one-boot .b-logo { width: 150px; height: auto; }
      #one-boot .b-load { display: flex; flex-direction: column; align-items: center; gap: 8px; }
      #one-boot .b-ld { position: relative; width: 44px; height: 28px; }
      #one-boot .b-ld i { position: absolute; left: calc(var(--k) * 12px); bottom: calc(var(--k) * 7px); color: var(--b-brand); opacity: .25; line-height: 0; }
      #one-boot .b-ld i:last-child { color: #FF8A1F; }
      #one-boot .b-ld svg { width: 16px; height: 16px; }
      #one-boot .b-msg { margin: 0; font: 500 14px/20px 'DM Sans Variable', 'DM Sans', ui-sans-serif, sans-serif; color: var(--b-text-2); }
      #one-boot .b-priv { position: absolute; left: 0; right: 0; bottom: 28px; margin: 0; padding: 0 16px; text-align: center; font-size: 12px; color: var(--b-text-3); }
      @media (max-width: 520px) {
        #one-boot .b-stage { top: 42%; --u: calc(100vw / 950); }
        #one-boot .b-lens { width: 64px; height: 64px; }
        #one-boot .b-foot { top: calc(42% + 112px); }
        #one-boot .b-logo { width: 140px; }

      @keyframes bFlow { to { stroke-dashoffset: -100; } }
      @keyframes bComet { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -100; } }
      @keyframes bBreathe { 0%, 100% { opacity: .7; scale: .92; } 50% { opacity: 1; scale: 1.08; } }
      @keyframes bLd { 0%, 100% { opacity: .22; translate: 0 0; } 30% { opacity: 1; translate: 0 -5px; } 60% { opacity: .22; translate: 0 0; } }
      @keyframes bIn { from { opacity: 0; } }
      @media (prefers-reduced-motion: no-preference) {
        #one-boot .b-flow { animation: bFlow var(--dur) linear infinite; }
        #one-boot .b-comet { animation: bComet 7.5s linear infinite; }
        #one-boot .b-halo { animation: bBreathe 4s ease-in-out infinite; }

      @media (prefers-reduced-motion: reduce) {
        #one-boot .b-comet { display: none; }
        #one-boot .b-ld i { opacity: 1; }
        #one-boot { transition: none; }
