<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" class="ai ai-readiness ai-loop" role="img" aria-label="Readiness (animated)">
<style>
svg{color:#1554D6;fill:currentColor;overflow:visible}
*{transform-box:view-box}
.s{opacity:.42}.p-turn{opacity:0}.p-dB{opacity:0}.p-chk{stroke-dasharray:12;stroke-dashoffset:0}
@keyframes aiBar{0%,22%,100%{transform:none}4%{transform:scaleY(.12)}14%{transform:scaleY(1.08)}}
@media (prefers-reduced-motion: no-preference){
.ai-loop .p-r1{animation:aiBar 2.8s cubic-bezier(.3,.7,.3,1) 0ms infinite;transform-origin:0px 21px}
.ai-loop .p-r2{animation:aiBar 2.8s cubic-bezier(.3,.7,.3,1) 80ms infinite;transform-origin:0px 21px}
.ai-loop .p-r3{animation:aiBar 2.8s cubic-bezier(.3,.7,.3,1) 160ms infinite;transform-origin:0px 21px}
.ai-loop .p-r4{animation:aiBar 2.8s cubic-bezier(.3,.7,.3,1) 240ms infinite;transform-origin:0px 21px}
}
</style>
