services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-planthepath_uat}
      POSTGRES_USER: ${POSTGRES_USER:-planthepath_uat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile.api
    restart: unless-stopped
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 3000
      API_CORS_ORIGIN: https://oneby8.com
      PTP_INVITATION_BASE_URL: https://oneby8.com
      PTP_MAIL_FROM: info@ai8ht.pro
      # Sign-in and automation settings come from the server's .env (see .env.example).
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
      COGNITO_STAFF_USER_POOL_ID: ${COGNITO_STAFF_USER_POOL_ID:-}
      COGNITO_STAFF_CLIENT_ID: ${COGNITO_STAFF_CLIENT_ID:-}
      AUTOMATION_SIGNING_SECRET: ${AUTOMATION_SIGNING_SECRET:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-planthepath_uat}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-planthepath_uat}
      NODE_ENV: ${NODE_ENV:-development}
      # Outgoing mail (ADR-042, docs/ops/runbook-mail-sender.md). Blank = no mail is sent. The
      # password is typed into this server's .env only; it is never committed.
      PTP_SMTP_HOST: ${PTP_SMTP_HOST:-}
      PTP_SMTP_PORT: ${PTP_SMTP_PORT:-}
      PTP_SMTP_SECURITY: ${PTP_SMTP_SECURITY:-}
      PTP_SMTP_USER: ${PTP_SMTP_USER:-}
      PTP_SMTP_PASSWORD: ${PTP_SMTP_PASSWORD:-}
      # AI inference endpoint (ADR-047, docs/ops/runbook-inference-endpoint.md). All blank = AI
      # unavailable: every AI job fails PROVIDER_UNCONFIGURED and nothing crashes. The key is typed
      # into this server's .env only; it is never committed. Used by AI jobs and `ai:probe` run in
      # this container; the API itself only reports whether they are set.
      ONE_AI_BASE_URL: ${ONE_AI_BASE_URL:-}
      ONE_AI_API_KEY: ${ONE_AI_API_KEY:-}
      ONE_AI_MODEL: ${ONE_AI_MODEL:-}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      - internal

  web:
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile.web
      args:
        VITE_API_BASE_URL: https://oneby8.com
        VITE_COGNITO_DOMAIN: ${VITE_COGNITO_DOMAIN:-}
        VITE_COGNITO_CLIENT_ID: ${VITE_COGNITO_CLIENT_ID:-}
        VITE_COGNITO_USER_POOL_ID: ${VITE_COGNITO_USER_POOL_ID:-}
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - internal

  # demo.oneby8.com: the demo site for colleges and employers (docs/ops/runbook-demo-site.md).
  # A separate build of the same web app with VITE_DEMO_SITE=true. It is entirely
  # in-browser sample data: no sign-in settings, no API address, no database, and Caddy
  # sends it no /api traffic - it can never reach the production API or production data.
  web-demo:
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile.web
      args:
        VITE_DEMO_SITE: "true"
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - internal

  reverse-proxy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
      - web-demo
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # A directory, not a single file, so replacing users.caddy reaches the running container.
      - ./demo-access:/etc/caddy/demo-access:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
