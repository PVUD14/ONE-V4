<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" class="ai ai-bell ai-loop" role="img" aria-label="Notifications (animated)">
<style>
svg{color:#1554D6;fill:currentColor;overflow:visible}
*{transform-box:view-box}
.s{opacity:.42}.p-turn{opacity:0}.p-dB{opacity:0}.p-chk{stroke-dasharray:12;stroke-dashoffset:0}
@keyframes aiBell{0%,30%,100%{transform:none}5%{transform:rotate(14deg)}10%{transform:rotate(-12deg)}15%{transform:rotate(8deg)}20%{transform:rotate(-4deg)}}
@keyframes aiClap{0%,30%,100%{transform:none}5%{transform:translateX(-1.6px)}10%{transform:translateX(1.6px)}15%{transform:translateX(-1px)}20%{transform:translateX(.4px)}}
@media (prefers-reduced-motion: no-preference){
.ai-loop .p-bell{animation:aiBell 2.8s cubic-bezier(.3,.7,.3,1) 0ms infinite;transform-origin:12px 3.4px}
.ai-loop .p-clap{animation:aiClap 2.8s cubic-bezier(.3,.7,.3,1) 0ms infinite;transform-origin:12px 20px}
}
</style>
