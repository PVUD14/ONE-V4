name: planthepath-n8n

services:
  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    restart: unless-stopped
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD:?set N8N_DB_PASSWORD}
    volumes:
      - n8n-postgres-data:/var/lib/postgresql/data
    networks: [n8n-data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits: { cpus: '1.00', memory: 1G }

  n8n:
    image: n8nio/n8n:2.35.3@sha256:31375a4f730081a139bba2d379bf2efaa8e662cc9e131d12bb5e15859d4f0282
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    user: '1000:1000'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=1000,gid=1000
      - /home/node/.cache:rw,noexec,nosuid,nodev,size=64m,uid=1000,gid=1000
    volumes:
      - n8n-state:/home/node/.n8n
    networks: [n8n-data, automation-private]
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: '5432'
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?set N8N_DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY}
      N8N_USER_MANAGEMENT_JWT_SECRET: ${N8N_USER_MANAGEMENT_JWT_SECRET:?set N8N_USER_MANAGEMENT_JWT_SECRET}
      N8N_HOST: n8n
      N8N_PORT: '5678'
      N8N_PROTOCOL: http
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://n8n:5678/}
      GENERIC_TIMEZONE: Asia/Kolkata
      TZ: Asia/Kolkata
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: 'true'
      N8N_BLOCK_ENV_ACCESS_IN_NODE: 'true'
      N8N_RESTRICT_FILE_ACCESS_TO: /home/node/.n8n
      N8N_PUBLIC_API_DISABLED: 'true'
      N8N_COMMUNITY_PACKAGES_ENABLED: 'false'
      N8N_VERIFIED_PACKAGES_ENABLED: 'false'
      N8N_UNVERIFIED_PACKAGES_ENABLED: 'false'
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_VERSION_NOTIFICATIONS_ENABLED: 'false'
      N8N_TEMPLATES_ENABLED: 'false'
      N8N_PERSONALIZATION_ENABLED: 'false'
      N8N_HIRING_BANNER_ENABLED: 'false'
      N8N_AI_ENABLED: 'false'
      N8N_DISABLED_MODULES: mcp-registry,instance-ai,workflow-builder,chat-hub,mcp,quick-connect
      N8N_RUNNERS_TASK_TIMEOUT: '60'
      N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES: '268435456'
      N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES: '1000'
      N8N_CONCURRENCY_PRODUCTION_LIMIT: '5'
      EXECUTIONS_TIMEOUT: '120'
      EXECUTIONS_TIMEOUT_MAX: '300'
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: 'false'
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: 'false'
      EXECUTIONS_DATA_PRUNE: 'true'
      EXECUTIONS_DATA_MAX_AGE: '24'
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: '1000'
      NODES_INCLUDE: '["n8n-nodes-base.webhook","n8n-nodes-base.emailSend","n8n-nodes-base.respondToWebhook"]'
      NODES_EXCLUDE: '["n8n-nodes-base.code","n8n-nodes-base.executeCommand","n8n-nodes-base.readBinaryFile","n8n-nodes-base.readWriteFile","n8n-nodes-base.writeBinaryFile","n8n-nodes-base.httpRequest","n8n-nodes-base.ssh","n8n-nodes-base.ftp","n8n-nodes-base.git","n8n-nodes-base.postgres","n8n-nodes-base.mySql","n8n-nodes-base.microsoftSql","n8n-nodes-base.mongoDb","n8n-nodes-base.redis","n8n-nodes-base.awsSns","n8n-nodes-base.awsSnsTrigger","n8n-nodes-base.googleContacts","n8n-nodes-base.slack","n8n-nodes-base.asana","n8n-nodes-base.todoist","n8n-nodes-base.openAi"]'
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5678/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: '1.00', memory: 1G }
        reservations: { cpus: '0.25', memory: 256M }

  mailpit:
    image: axllent/mailpit:v1.30.6@sha256:7f33095f80e901f6ad08028f06ca284aa58fe84942be5496008d041d3b9f4d4d
    profiles: [mailpit]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    networks: [automation-private]
    environment:
      MP_DATABASE: /tmp/mailpit.db
      MP_MAX_MESSAGES: '100'
      MP_SMTP_BIND_ADDR: 0.0.0.0:1025
      MP_UI_BIND_ADDR: 0.0.0.0:8025
      MP_DISABLE_VERSION_CHECK: 'true'
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { cpus: '0.50', memory: 256M }

networks:
  n8n-data:
    internal: true
  automation-private:
    internal: true

volumes:
  n8n-postgres-data: {}
  n8n-state: {}
