name: phase1-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: ['agent/phase-1-*']

permissions:
  contents: read

jobs:
  typescript-foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: planthepath
          POSTGRES_PASSWORD: planthepath_ci
          POSTGRES_DB: planthepath_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U planthepath -d planthepath_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://planthepath:planthepath_ci@127.0.0.1:5432/planthepath_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm typecheck
      - run: pnpm test
