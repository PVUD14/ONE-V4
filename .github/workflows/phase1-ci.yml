name: phase1-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: ['agent/phase-1-*', 'agent/**']

permissions:
  contents: read

jobs:
  typescript-foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: planthepath
          POSTGRES_PASSWORD: planthepath_ci
          POSTGRES_DB: planthepath_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U planthepath -d planthepath_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://planthepath:planthepath_ci@127.0.0.1:5432/planthepath_test
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate n8n source artifacts and deployment materialization
        shell: bash
        env:
          PTP_N8N_JWT_CREDENTIAL_ID: ci_jwt_credential
          PTP_SMTP_CREDENTIAL_ID: ci_smtp_credential
        run: |
          set -euo pipefail
          node automation/n8n/scripts/validate-workflows.mjs
          node automation/n8n/scripts/materialize-workflows.mjs --output "$RUNNER_TEMP/planthepath-n8n-workflows"
          test "$(find "$RUNNER_TEMP/planthepath-n8n-workflows" -name workflow.json | wc -l)" -eq 6
          N8N_DB_PASSWORD=ci-only-db-password N8N_ENCRYPTION_KEY=ci-only-encryption-key-000000000000 N8N_USER_MANAGEMENT_JWT_SECRET=ci-only-jwt-secret-000000000000 docker compose --profile mailpit -f automation/n8n/docker-compose.yml -f automation/n8n/compose.local.yaml config --quiet
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # oneby8.com must ship no pilot sample data and no sandbox marker; the sandbox build
      # for demo.oneby8.com must be the real application with the marker (ADR-046,
      # apps/web/scripts/check-demo-boundary.mjs). Same check the web image build runs.
      - name: Demo boundary (production and sandbox builds)
        shell: bash
        run: |
          set -euo pipefail
          node apps/web/scripts/check-demo-boundary.mjs apps/web/dist production
          VITE_SANDBOX=true pnpm --filter @planthepath/web exec vite build --outDir "$RUNNER_TEMP/web-sandbox" --emptyOutDir
          node apps/web/scripts/check-demo-boundary.mjs "$RUNNER_TEMP/web-sandbox" sandbox
      - name: Production preflight cases (synthetic app.env only)
        run: bash deploy/scripts/test-preflight-production.sh
      - run: pnpm db:migrate
      - name: Validate additive upgrade from Phase B migrations
        shell: bash
        run: |
          set -euo pipefail
          export PGPASSWORD=planthepath_ci
          createdb -h 127.0.0.1 -U planthepath planthepath_upgrade
          for migration in packages/persistence/drizzle/0000*.sql packages/persistence/drizzle/0001*.sql packages/persistence/drizzle/0002*.sql packages/persistence/drizzle/0003*.sql; do
            psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U planthepath -d planthepath_upgrade -f "$migration"
          done
          DATABASE_URL=postgresql://planthepath:planthepath_ci@127.0.0.1:5432/planthepath_upgrade pnpm db:migrate
      - name: Scan production dependencies
        run: pnpm audit --prod --audit-level=high

  # ENG-21: the bake-off harness that runs on the inference pod (Python, standard library only), against
  # a local fake endpoint. No dependencies to install and no network beyond 127.0.0.1.
  bake-off-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Harness tests
        shell: bash
        run: python3 -m unittest discover -s deploy/ai-pod/bake-off/tests -v

  # ENG-13: the offline calibration job (Python, jobs/calibration). Uses the runner's own
  # python3 so no further action needs pinning; dependencies are pinned in requirements.txt.
  calibration-job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Parameter recovery on synthetic learners
        working-directory: jobs/calibration
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/calibration-venv"
          "$RUNNER_TEMP/calibration-venv/bin/python" -m pip install --quiet -r requirements-dev.txt
          "$RUNNER_TEMP/calibration-venv/bin/python" -m pytest -q
