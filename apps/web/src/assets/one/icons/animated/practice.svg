<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" class="ai ai-practice ai-loop" role="img" aria-label="Practice (animated)">
<style>
svg{color:#1554D6;fill:currentColor;overflow:visible}
*{transform-box:view-box}
.s{opacity:.42}.p-turn{opacity:0}.p-dB{opacity:0}.p-chk{stroke-dasharray:12;stroke-dashoffset:0}
@keyframes aiArrow{0%,22%,100%{transform:none;opacity:1}3%{transform:translate(5px,-5px);opacity:0}12%{transform:translate(-.8px,.8px);opacity:1}16%{transform:translate(.3px,-.3px)}}
@keyframes aiHit{0%,11%,22%,100%{transform:none}15%{transform:scale(.92)}}
@media (prefers-reduced-motion: no-preference){
.ai-loop .p-arw{animation:aiArrow 2.8s cubic-bezier(.3,.7,.3,1) 0ms infinite;transform-origin:12px 12px}
.ai-loop .p-tg{animation:aiHit 2.8s cubic-bezier(.3,.7,.3,1) 0ms infinite;transform-origin:11px 13px}
}
</style>
