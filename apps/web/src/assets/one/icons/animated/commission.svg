<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" class="ai ai-commission ai-loop" role="img" aria-label="Commission (animated)">
<style>
svg{color:#1554D6;fill:currentColor;overflow:visible}
*{transform-box:view-box}
.s{opacity:.42}.p-turn{opacity:0}.p-dB{opacity:0}.p-chk{stroke-dasharray:12;stroke-dashoffset:0}
@keyframes aiPeek{0%,26%,100%{transform:none;opacity:1}5%{transform:translateY(2.2px);opacity:.15}15%{transform:translateY(-.8px);opacity:1}}
@keyframes aiFlip{0%,20%,100%{transform:none}6%{transform:scaleX(.06)}12%{transform:scaleX(1)}}
@media (prefers-reduced-motion: no-preference){
.ai-loop .p-coin{animation:aiFlip 2.8s cubic-bezier(.3,.7,.3,1) 0ms infinite;transform-origin:16.6px 7.4px}
.ai-loop .p-cs2{animation:aiPeek 2.8s cubic-bezier(.3,.7,.3,1) 120ms infinite;transform-origin:8.6px 16px}
}
</style>
