<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" class="ai ai-skills ai-loop" role="img" aria-label="Skills (animated)">
<style>
svg{color:#1554D6;fill:currentColor;overflow:visible}
*{transform-box:view-box}
.s{opacity:.42}.p-turn{opacity:0}.p-dB{opacity:0}.p-chk{stroke-dasharray:12;stroke-dashoffset:0}
@keyframes aiBolt{0%,20%,100%{opacity:1;transform:none}4%{opacity:.3}8%{opacity:1;transform:translateY(-1.2px)}12%{opacity:.5}16%{opacity:1;transform:none}}
@keyframes aiDashR{0%,24%,100%{transform:none;opacity:1}5%{transform:translateX(-3px);opacity:0}16%{transform:translateX(.6px);opacity:1}}
@keyframes aiDashL{0%,24%,100%{transform:none;opacity:1}5%{transform:translateX(3px);opacity:0}16%{transform:translateX(-.6px);opacity:1}}
@media (prefers-reduced-motion: no-preference){
.ai-loop .p-bolt{animation:aiBolt 2.8s cubic-bezier(.3,.7,.3,1) 0ms infinite;transform-origin:12px 12px}
.ai-loop .p-dr{animation:aiDashR 2.8s cubic-bezier(.3,.7,.3,1) 0ms infinite;transform-origin:20px 16px}
.ai-loop .p-dl{animation:aiDashL 2.8s cubic-bezier(.3,.7,.3,1) 0ms infinite;transform-origin:4px 5px}
}
</style>
