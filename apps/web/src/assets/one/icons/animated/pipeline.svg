<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" class="ai ai-pipeline ai-loop" role="img" aria-label="Placement Pipeline (animated)">
<style>
svg{color:#1554D6;fill:currentColor;overflow:visible}
*{transform-box:view-box}
.s{opacity:.42}.p-turn{opacity:0}.p-dB{opacity:0}.p-chk{stroke-dasharray:12;stroke-dashoffset:0}
@keyframes aiFlow{0%,26%,100%{transform:none;opacity:1}4%{transform:translateX(-1.6px);opacity:.2}14%{transform:translateX(.5px);opacity:1}}
@media (prefers-reduced-motion: no-preference){
.ai-loop .p-s1{animation:aiFlow 2.8s cubic-bezier(.3,.7,.3,1) 0ms infinite;transform-origin:12px 12px}
.ai-loop .p-s2{animation:aiFlow 2.8s cubic-bezier(.3,.7,.3,1) 110ms infinite;transform-origin:12px 12px}
.ai-loop .p-s3{animation:aiFlow 2.8s cubic-bezier(.3,.7,.3,1) 220ms infinite;transform-origin:12px 12px}
}
</style>
