<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" class="ai ai-coach ai-loop" role="img" aria-label="AI Career Coach (animated)">
<style>
svg{color:#1554D6;fill:currentColor;overflow:visible}
*{transform-box:view-box}
.s{opacity:.42}.p-turn{opacity:0}.p-dB{opacity:0}.p-chk{stroke-dasharray:12;stroke-dashoffset:0}
@keyframes aiSpark{0%,26%,100%{transform:none}8%{transform:scale(.3) rotate(-45deg)}17%{transform:scale(1.3) rotate(20deg)}}
@keyframes aiPop{0%,24%,100%{transform:none}8%{transform:scale(.93)}16%{transform:scale(1.04)}}
@media (prefers-reduced-motion: no-preference){
.ai-loop .p-spk{animation:aiSpark 2.8s cubic-bezier(.3,.7,.3,1) 0ms infinite;transform-origin:12px 10.3px}
.ai-loop .p-bub{animation:aiPop 2.8s cubic-bezier(.3,.7,.3,1) 0ms infinite;transform-origin:6.5px 20px}
}
</style>
