<svg class="bd" xmlns="http://www.w3.org/2000/svg" width="124" height="138.00" viewBox="0 0 124 138" role="img" aria-label="Peer Mentor badge"><style>
.bd *{transform-box:view-box}
.bd-rim{stroke-dasharray:100;stroke-dashoffset:0}
.bd-glyph{transform-origin:62px 56px}
@keyframes L{0%{opacity:0;filter:grayscale(1) brightness(1.08)}4%{opacity:.55;filter:grayscale(1) brightness(1.08)}16%{opacity:1;filter:grayscale(0) brightness(1)}92%{opacity:1;filter:grayscale(0) brightness(1)}100%{opacity:0;filter:grayscale(0) brightness(1)}}
@keyframes B{0%,3%{transform:translate(10px,12px);opacity:0}13%,100%{transform:none;opacity:1}}
@keyframes F{0%,5%{transform:translate(-9px,-11px) scale(.9);opacity:0}12%{transform:translate(1px,1px) scale(1.03);opacity:1}17%,100%{transform:none;opacity:1}}
@keyframes R{0%,9%{stroke-dashoffset:100}21%,100%{stroke-dashoffset:0}}
@keyframes G{0%,10%{transform:scale(.4);opacity:0}16%{transform:scale(1.1);opacity:1}20%,100%{transform:none;opacity:1}}
@keyframes V{0%,17%{transform:translateY(7px);opacity:0}23%,100%{transform:none}}
@keyframes S{0%,38%{transform:translateX(0)}52%,100%{transform:translateX(230px)}}
@media (prefers-reduced-motion: no-preference){
.bd-all{animation:L 6s cubic-bezier(.2,.8,.2,1) infinite}
.bd-back{animation:B 6s cubic-bezier(.2,.8,.2,1) infinite}
.bd-face{animation:F 6s cubic-bezier(.2,.8,.2,1) infinite}
.bd-rim{animation:R 6s cubic-bezier(.2,.8,.2,1) infinite}
.bd-glyph{animation:G 6s cubic-bezier(.2,.8,.2,1) infinite}
.bd-chev{animation:V 6s cubic-bezier(.2,.8,.2,1) infinite;animation-delay:calc(var(--k) * 90ms)}
.bd-sheen{animation:S 6s cubic-bezier(.65,0,.35,1) infinite}
}</style>
