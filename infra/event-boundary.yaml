AWSTemplateFormatVersion: '2010-09-09'
Description: PlanThePath production integration-event boundary (EventBridge to private SQS consumers)

Parameters:
  EnvironmentName:
    Type: String
    AllowedPattern: '^[a-z0-9-]{2,24}$'

Resources:
  IntegrationEventQueueKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub 'PlanThePath ${EnvironmentName} integration-event queues'
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AccountAdministration
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action: kms:*
            Resource: '*'
          - Sid: EventBridgeQueueEncryption
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey
            Resource: '*'
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  IntegrationEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub 'planthepath-${EnvironmentName}'

  IntegrationEventDeadLetterQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      QueueName: !Sub 'planthepath-${EnvironmentName}-events-dlq'
      KmsMasterKeyId: !GetAtt IntegrationEventQueueKey.Arn
      MessageRetentionPeriod: 1209600

  IntegrationEventQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'planthepath-${EnvironmentName}-events'
      KmsMasterKeyId: !GetAtt IntegrationEventQueueKey.Arn
      MessageRetentionPeriod: 345600
      ReceiveMessageWaitTimeSeconds: 20
      VisibilityTimeout: 60
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt IntegrationEventDeadLetterQueue.Arn
        maxReceiveCount: 5

  IntegrationEventRule:
    Type: AWS::Events::Rule
    Properties:
      EventBusName: !Ref IntegrationEventBus
      EventPattern:
        source:
          - prefix: com.planthepath.
        detail-type:
          - notification.delivery.requested
      State: ENABLED
      Targets:
        - Id: private-sqs-consumer
          Arn: !GetAtt IntegrationEventQueue.Arn
          DeadLetterConfig:
            Arn: !GetAtt IntegrationEventDeadLetterQueue.Arn
          RetryPolicy:
            MaximumEventAgeInSeconds: 3600
            MaximumRetryAttempts: 5

  IntegrationEventQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref IntegrationEventQueue
        - !Ref IntegrationEventDeadLetterQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: EventBridgeOnly
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt IntegrationEventQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt IntegrationEventRule.Arn
          - Sid: EventBridgeDeadLetterOnly
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt IntegrationEventDeadLetterQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt IntegrationEventRule.Arn

  AutomationWorkerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'planthepath-${EnvironmentName}-automation-worker'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: event-boundary
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: PublishToExplicitBus
                Effect: Allow
                Action: events:PutEvents
                Resource: !GetAtt IntegrationEventBus.Arn
              - Sid: ConsumeExplicitQueue
                Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:ChangeMessageVisibility
                  - sqs:GetQueueAttributes
                Resource: !GetAtt IntegrationEventQueue.Arn
              - Sid: DecryptIntegrationEvents
                Effect: Allow
                Action: kms:Decrypt
                Resource: !GetAtt IntegrationEventQueueKey.Arn

  IntegrationEventDeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: PlanThePath automation events reached the dead-letter queue
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt IntegrationEventDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  IntegrationEventAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: PlanThePath automation queue has an old unprocessed event
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !GetAtt IntegrationEventQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 5
      Threshold: 300
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

Outputs:
  EventBusName:
    Value: !Ref IntegrationEventBus
  QueueUrl:
    Value: !Ref IntegrationEventQueue
  DeadLetterQueueUrl:
    Value: !Ref IntegrationEventDeadLetterQueue
  AutomationWorkerRoleArn:
    Value: !GetAtt AutomationWorkerRole.Arn
  QueueKeyArn:
    Value: !GetAtt IntegrationEventQueueKey.Arn
