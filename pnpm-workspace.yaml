packages:
  - 'apps/*'
  - 'packages/*'

# multer <2.3.0 carries three high-severity DoS advisories (GHSA-qfvm-cv95-jqjf, GHSA-535w-7cp7-47q4 and a
# third, 2026-09-08) and arrives through @nestjs/platform-express 11. Lifting it within its own major keeps
# NestJS on 11; drop this override once NestJS pins a patched multer itself.
overrides:
  multer: '>=2.3.0 <3'
