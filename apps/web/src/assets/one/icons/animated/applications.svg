<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" class="ai ai-applications ai-loop" role="img" aria-label="Applications (animated)">
<style>
svg{color:#1554D6;fill:currentColor;overflow:visible}
*{transform-box:view-box}
.s{opacity:.42}.p-turn{opacity:0}.p-dB{opacity:0}.p-chk{stroke-dasharray:12;stroke-dashoffset:0}
@keyframes aiFly{0%,22%,100%{transform:none;opacity:1}10%{transform:translate(8px,-8px);opacity:0}10.5%{transform:translate(-8px,8px);opacity:0}}
