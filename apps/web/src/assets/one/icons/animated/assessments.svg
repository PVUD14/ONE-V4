<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" class="ai ai-assessments ai-loop" role="img" aria-label="Assessments (animated)">
<style>
svg{color:#1554D6;fill:currentColor;overflow:visible}
*{transform-box:view-box}
.s{opacity:.42}.p-turn{opacity:0}.p-dB{opacity:0}.p-chk{stroke-dasharray:12;stroke-dashoffset:0}
@keyframes aiTick{0%,22%,100%{stroke-dashoffset:0}1%{stroke-dashoffset:12}6%{stroke-dashoffset:12}20%{stroke-dashoffset:0}}
@keyframes aiClip{0%,22%,100%{transform:none}8%{transform:translateY(-1.3px)}15%{transform:translateY(.3px)}}
@media (prefers-reduced-motion: no-preference){
.ai-loop .p-chk{animation:aiTick 2.8s cubic-bezier(.3,.7,.3,1) 0ms infinite;transform-origin:12px 12px}
.ai-loop .p-clip{animation:aiClip 2.8s cubic-bezier(.3,.7,.3,1) 0ms infinite;transform-origin:11px 4px}
}
</style>
